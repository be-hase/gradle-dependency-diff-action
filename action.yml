name: 'gradle-dependency-diff-action'
description:
  'Report the Gradle dependency differences caused by the Pull Request'
author: 'be-hase'

branding:
  icon: 'heart'
  color: 'red'

inputs:
  tool-version:
    description:
      'Version of
      dependency-tree-diff-version(https://github.com/JakeWharton/dependency-tree-diff).'
    required: false
    default: '1.2.1'
  include-project-regex:
    description: 'Filter by projects that match this regular expression.'
    required: false
  exclude-project-regex:
    description: 'Filter by projects that do not match this regular expression.'
    required: false
  include-root-project:
    description: 'Whether to target the root project or not.'
    required: false
    default: 'true'
  configurations:
    description: 'Configuration of dependencies (CSV).'
    required: false
    default: 'runtimeClasspath'
  token:
    description: 'GitHub token.'
    required: false
    default: ${{ github.token }}
  post-pr-comment:
    description: 'Post a comment when there are dependency differences.'
    required: false
    default: 'true'
  update-pr-body:
    description: 'Update the checks URL in the PR body'
    required: false
    default: 'false'
  assign-label:
    description: 'Assign a label when there are dependency differences.'
    required: false
    default: 'true'
  label-name:
    description: 'The label name to use when assigning a label.'
    required: false
    default: 'dependencies-change'
  upload-artifact:
    description:
      'Upload the dependency differences as a text file format to the actions
      artifact.'
    required: false
    default: 'true'
  custom-endpoint-url:
    description:
      'By default, the report is recorded in GitHub checks. If you want to send
      it to a custom server, please use this option. (TODO: document)'
    required: false
  custom-endpoint-headers:
    description: 'The header used when sending to a custom endpoint.'
    required: false

runs:
  using: node20
  main: dist/index.js
