# Configuration for Trivy, run as part of super-linter.
# https://trivy.dev/latest/docs/references/configuration/config-file/
disable-telemetry: true
exit-code: 1
scan:
  skip-dirs:
    # dist/ is generated from src/, which is still scanned. The bundled
    # code contains the literal `ghp_` token prefix used by getGitUrl(),
    # which trips the secret scanner.
    - '**/dist'
