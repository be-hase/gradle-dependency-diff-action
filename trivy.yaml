# Configuration for Trivy, run as part of super-linter.
# https://trivy.dev/latest/docs/references/configuration/config-file/
scan:
  skip-dirs:
    # The bundled action code (and its sourcemap) contains the literal
    # `ghp_` token prefix, which getGitUrl() uses to detect personal
    # access tokens. Trivy's secret scanner reports it as a false
    # positive. dist/ is generated from src/, which is still scanned.
    - dist
